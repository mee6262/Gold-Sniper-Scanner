name: XAUUSD SMC Scanner

on:
  schedule:
    # รันเฉพาะช่วงเวลาตลาดเปิด (จันทร์-ศุกร์ 01:00 - 19:00 UTC)
    - cron: '0,30 1-19 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gold Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save Alert State (Deduplication)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_alert_time || true
          git pull --rebase origin main || true
          git commit -m "update last alert state [skip ci]" || true
          git push || true
