name: XAUUSD SMC Scanner

on:
  schedule:
    # รันทุกๆ นาทีที่ 00 และ 30 (ทุก 30 นาที ตรงเวลาปิดแท่ง)
    - cron: '0,30 * * * *'
  workflow_dispatch: # ปุ่มกดรันเองมือหมุนบน GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gold Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save Alert State (Deduplication)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_alert_time || true
          git commit -m "update last alert state [skip ci]" || true
          git push || true
